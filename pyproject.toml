[project]
name = "ipynb-jjsm-tools"
version = "0.3"
description = "Utility tools for notebooks and data workflows"
authors = [{name = "Juan José Sanchez Medina"}]
dependencies = [
    "pandas",
    "fsspec",
    "s3fs",
    "cmcrameri>=1.10",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
