[project]
name = "ipynb-jjsm-tools"
version = "0.3.6"
description = "Utility tools for notebooks and data workflows"
authors = [{name = "Juan José Sanchez Medina"}]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "cmcrameri",
    "fsspec",
    "matplotlib",
    "numpy",
    "pandas",
    "polars",
    "scipy",
]

[project.optional-dependencies]
# Jupyter itself
notebook = [
    "ipykernel",
    "ipywidgets",
    "ipympl",
    "notebook",
    "jupyterlab",
]

# General-purpose scientific computing (physics labs, EM, etc. — no astronomy)
lab = [
    "scikit-image",
    "scikit-learn",
    "seaborn",
    "h5py",
    "dask",
    "numba",
    "lmfit",
    "emcee",
    "uncertainties",
]

# Everything astronomy: core astropy stack (needed by ipynb_jjsm_tools.photometry),
# data analysis/image processing, survey/archive access, and specialized packages
astro = [
    "astropy",
    "photutils",
    "astroquery",
    "astroscrappy",
    "ccdproc",
    "reproject",
    "regions",
    "sep",
    "pyvo",
    "healpy",
    "specutils",
    "spectral-cube",
    "astroplan",
    "astro-datalab",
    "sparclclient",
    "antares-client",
    "unTimely-Catalog-explorer",
    "glue-core",
    "glueviz",
    "ginga",
    "jdaviz",
    "ipyaladin",
    "mocpy",
    "ndcube",
    "gwcs",
    "asdf",
    "asdf-astropy",
    "batman-package",
    "rebound",
    "radio-beam",
    "synphot",
    "mpdaf",
    "ppxf",
    "pafit",
    "vorbin",
    "plotbin",
    "gatspy",
]

full = [
    "ipynb-jjsm-tools[notebook,lab,astro]",
]

[project.scripts]
jjsm-setup = "ipynb_jjsm_tools.setup.run:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]