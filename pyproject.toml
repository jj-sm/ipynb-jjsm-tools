[project]
name = "ipynb-jjsm-tools"
version = "0.3.6"
description = "Utility tools for notebooks and data workflows"
authors = [{name = "Juan José Sanchez Medina"}]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "cmcrameri",
    "fsspec",
    "matplotlib",
    "numpy",
    "pandas",
    "polars",
    "scipy",
]

[project.optional-dependencies]
# Jupyter itself
notebook = [
    "ipykernel",
    "ipywidgets",
    "ipympl",
    "notebook",
    "jupyterlab",
]

# Core astropy stack needed by ipynb_jjsm_tools.photometry
astro = [
    "astropy",
    "photutils",
]

# General astronomical data analysis / image processing
lab = [
    "ipynb-jjsm-tools[astro]",
    "astroquery",
    "astroscrappy",
    "ccdproc",
    "reproject",
    "regions",
    "sep",
    "scikit-image",
    "scikit-learn",
    "seaborn",
    "pyvo",
    "healpy",
    "h5py",
    "dask",
    "numba",
    "lmfit",
    "emcee",
    "uncertainties",
    "specutils",
    "spectral-cube",
    "astroplan",
]

# Survey/archive access, visualization tools, and specialized dynamics/photometry packages
science = [
    "astro-datalab",
    "sparclclient",
    "antares-client",
    "unTimely-Catalog-explorer",
    "glue-core",
    "glueviz",
    "ginga",
    "jdaviz",
    "ipyaladin",
    "mocpy",
    "ndcube",
    "gwcs",
    "asdf",
    "asdf-astropy",
    "batman-package",
    "rebound",
    "radio-beam",
    "synphot",
    "mpdaf",
    "ppxf",
    "pafit",
    "vorbin",
    "plotbin",
    "gatspy",
]

full = [
    "ipynb-jjsm-tools[notebook,astro,lab,science]",
]

[project.scripts]
jjsm-setup = "ipynb_jjsm_tools.setup.run:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]